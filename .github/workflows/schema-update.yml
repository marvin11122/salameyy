name: Update files

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  update-schema:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go run . schema > ./schema.json
      - run: go generate ./internal/agent/hyper/...
      - uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v5
        with:
          commit_message: "chore: update SALAMEY generated files"
          branch: main
          commit_user_name: salamey
          commit_user_email: salamey@users.noreply.github.com
          commit_author: SALAMEY <salamey@users.noreply.github.com>
